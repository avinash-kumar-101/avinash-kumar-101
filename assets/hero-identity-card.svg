<svg width="360" height="520" viewBox="0 0 360 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Identity scan card for Avinash Kumar</title>
  <desc id="desc">A premium dark identity scan card with avatar, verification badge, fingerprint, and profile details.</desc>
  <defs>
    <linearGradient id="cardBg" x1="28" y1="18" x2="332" y2="502" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#071827"/>
    </linearGradient>
    <linearGradient id="scanLine" x1="0" y1="0" x2="360" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#58A6FF" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#7DD3FC"/>
      <stop offset="0.55" stop-color="#58A6FF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 245) rotate(90) scale(210 190)">
      <stop stop-color="#1F6FEB" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#1F6FEB" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" stroke="#58A6FF" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="358" height="518" rx="26" fill="#060B12" stroke="#30363D"/>
  <path d="M42 18H318L342 42V478L318 502H42L18 478V42L42 18Z" fill="url(#cardBg)" stroke="#1F6FEB" stroke-opacity="0.66"/>
  <path d="M56 34H304L326 56V464L304 486H56L34 464V56L56 34Z" fill="url(#blueGlow)" stroke="#58A6FF" stroke-opacity="0.22"/>
  <rect x="44" y="48" width="272" height="424" rx="12" fill="url(#grid)" opacity="0.85"/>

  <g opacity="0.95">
    <path d="M60 92V70H96" stroke="#58A6FF" stroke-width="2"/>
    <path d="M300 92V70H264" stroke="#58A6FF" stroke-width="2"/>
    <path d="M60 208V230H96" stroke="#58A6FF" stroke-width="2"/>
    <path d="M300 208V230H264" stroke="#58A6FF" stroke-width="2"/>
  </g>

  <text x="70" y="60" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.6" fill="#58A6FF">IDENTITY SCAN</text>
  <line x1="190" y1="56" x2="298" y2="56" stroke="#1F6FEB" stroke-opacity="0.8"/>

  <clipPath id="avatarClip">
    <rect x="102" y="86" width="156" height="122" rx="10"/>
  </clipPath>
  <g clip-path="url(#avatarClip)">
    <rect x="102" y="86" width="156" height="122" rx="10" fill="#111827"/>
    <image href="https://github.com/avinash-kumar-101.png?size=240" x="102" y="78" width="156" height="156" preserveAspectRatio="xMidYMid slice"/>
    <rect x="102" y="86" width="156" height="122" fill="#0D1117" opacity="0.12"/>
  </g>

  <rect x="36" y="148" width="288" height="7" fill="url(#scanLine)" filter="url(#glow)">
    <animate attributeName="y" values="88;208;88" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/>
  </rect>

  <rect x="58" y="250" width="244" height="38" rx="19" fill="#071827" stroke="#1F6FEB" stroke-opacity="0.3"/>
  <circle cx="78" cy="269" r="7" fill="#238636">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  <text x="102" y="274" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.2" fill="#3FB950">IDENTITY VERIFIED</text>
  <circle cx="282" cy="269" r="8" stroke="#3FB950" stroke-width="1.5"/>
  <path d="M278 269L281 272L287 264" stroke="#3FB950" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="58" y="316" font-size="11" font-weight="800" letter-spacing="1.6" fill="#8B949E">NAME</text>
    <text x="154" y="316" font-size="13" font-weight="650" fill="#E6EDF3">Avinash Kumar</text>
    <text x="58" y="346" font-size="11" font-weight="800" letter-spacing="1.6" fill="#8B949E">ROLE</text>
    <text x="154" y="346" font-size="13" font-weight="650" fill="#E6EDF3">Full Stack Developer</text>
    <text x="58" y="376" font-size="11" font-weight="800" letter-spacing="1.6" fill="#8B949E">LOCATION</text>
    <text x="154" y="376" font-size="13" font-weight="650" fill="#E6EDF3">Bhagalpur, Bihar</text>
    <text x="58" y="406" font-size="11" font-weight="800" letter-spacing="1.6" fill="#8B949E">STACK</text>
    <text x="154" y="406" font-size="13" font-weight="650" fill="#E6EDF3">MERN | Next.js | SQL</text>
    <text x="58" y="436" font-size="11" font-weight="800" letter-spacing="1.6" fill="#8B949E">STATUS</text>
    <text x="154" y="436" font-size="13" font-weight="750" fill="#3FB950">Open to Opportunities</text>
  </g>

  <g transform="translate(180 470)" stroke="#58A6FF" stroke-opacity="0.82" filter="url(#glow)">
    <path d="M0-28c18 0 28 12 28 28M0-20c13 0 20 8 20 20M0-12c8 0 12 5 12 12M0-28c-18 0-28 12-28 28M0-20c-13 0-20 8-20 20M0-12c-8 0-12 5-12 12" stroke-width="2" stroke-linecap="round"/>
    <path d="M0-34c25 0 38 15 38 34M0-34c-25 0-38 15-38 34" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
  </g>
  <text x="180" y="502" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="750" letter-spacing="1.4" fill="#58A6FF">VERIFICATION 100%</text>
</svg>
