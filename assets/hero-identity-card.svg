<svg width="360" height="500" viewBox="0 0 360 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Identity scan card for Avinash Kumar</title>
  <desc id="desc">A premium dark identity scan card with avatar, verification badge, fingerprint, and profile details.</desc>
  <defs>
    <linearGradient id="cardBg" x1="28" y1="18" x2="332" y2="482" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#071827"/>
    </linearGradient>
    <linearGradient id="scanLine" x1="0" y1="0" x2="360" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#3B82F6" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#3B82F6" stop-opacity="0.86"/>
      <stop offset="0.55" stop-color="#3B82F6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 245) rotate(90) scale(210 190)">
      <stop stop-color="#1F6FEB" stop-opacity="0.13"/>
      <stop offset="0.55" stop-color="#1F6FEB" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" stroke="#58A6FF" stroke-opacity="0.04"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="358" height="498" rx="28" fill="#080D14" stroke="#30363D" stroke-opacity="0.75"/>
  <rect x="20" y="20" width="320" height="460" rx="28" fill="url(#cardBg)" stroke="#2B3440" stroke-opacity="0.95"/>
  <rect x="40" y="40" width="280" height="420" rx="22" fill="url(#blueGlow)" stroke="#2B3440" stroke-opacity="0.7"/>
  <rect x="48" y="54" width="264" height="390" rx="14" fill="url(#grid)" opacity="0.5"/>

  <g opacity="0.55">
    <path d="M64 96V74H102" stroke="#3B82F6" stroke-width="1.2"/>
    <path d="M296 96V74H258" stroke="#3B82F6" stroke-width="1.2"/>
    <path d="M64 206V228H102" stroke="#3B82F6" stroke-width="1.2"/>
    <path d="M296 206V228H258" stroke="#3B82F6" stroke-width="1.2"/>
  </g>

  <text x="70" y="62" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.3" fill="#94A3B8">IDENTITY SCAN</text>
  <line x1="190" y1="58" x2="292" y2="58" stroke="#2B3440" stroke-opacity="0.85"/>

  <clipPath id="avatarClip">
    <rect x="86" y="84" width="188" height="138" rx="12"/>
  </clipPath>
  <g clip-path="url(#avatarClip)">
    <rect x="86" y="84" width="188" height="138" rx="12" fill="#111827"/>
    <image href="data:image/png;base64," x="86" y="62" width="188" height="188" preserveAspectRatio="xMidYMid slice"/>
    <rect x="86" y="84" width="188" height="138" fill="#0D1117" opacity="0.08"/>
  </g>

  <rect x="54" y="151" width="252" height="3" rx="1.5" fill="url(#scanLine)" filter="url(#glow)">
    <animate attributeName="y" values="96;206;96" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/>
  </rect>

  <rect x="64" y="244" width="232" height="34" rx="17" fill="#111827" stroke="#2B3440" stroke-opacity="0.9"/>
  <circle cx="82" cy="261" r="6" fill="#238636">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  <text x="108" y="266" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="750" letter-spacing="1.05" fill="#F8FAFC">IDENTITY VERIFIED</text>
  <circle cx="276" cy="261" r="7" stroke="#22C55E" stroke-width="1.4"/>
  <path d="M272 261L275 264L281 256" stroke="#22C55E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
    <text x="58" y="304" font-size="10" font-weight="750" letter-spacing="1.5" fill="#94A3B8">NAME</text>
    <text x="154" y="304" font-size="13" font-weight="600" fill="#F8FAFC">Avinash Kumar</text>
    <text x="58" y="332" font-size="10" font-weight="750" letter-spacing="1.5" fill="#94A3B8">ROLE</text>
    <text x="154" y="332" font-size="13" font-weight="600" fill="#F8FAFC">Full Stack Developer</text>
    <text x="58" y="360" font-size="10" font-weight="750" letter-spacing="1.5" fill="#94A3B8">LOCATION</text>
    <text x="154" y="360" font-size="13" font-weight="600" fill="#F8FAFC">Bhagalpur, Bihar</text>
    <text x="58" y="388" font-size="10" font-weight="750" letter-spacing="1.5" fill="#94A3B8">EDUCATION</text>
    <text x="154" y="388" font-size="13" font-weight="600" fill="#F8FAFC">B.Tech CSE (2026)</text>
    <text x="58" y="416" font-size="10" font-weight="750" letter-spacing="1.5" fill="#94A3B8">STACK</text>
    <text x="154" y="416" font-size="13" font-weight="600" fill="#F8FAFC">MERN Stack</text>
    <text x="58" y="444" font-size="10" font-weight="750" letter-spacing="1.5" fill="#94A3B8">STATUS</text>
    <circle cx="158" cy="440" r="4" fill="#22C55E"/>
    <text x="170" y="444" font-size="13" font-weight="750" fill="#F8FAFC">Available</text>
  </g>

  <rect x="64" y="462" width="232" height="24" rx="12" fill="#111827" stroke="#2B3440" stroke-opacity="0.85"/>
  <g transform="translate(91 474)" stroke="#3B82F6" stroke-opacity="0.72">
    <circle cx="0" cy="0" r="9" stroke-width="1"/>
    <path d="M0-6c4 0 6 3 6 6M0-2c2.6 0 4 1.6 4 4M0-6c-4 0-6 3-6 6M0-2c-2.6 0-4 1.6-4 4" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <text x="114" y="478" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1" fill="#F8FAFC">Verified Identity</text>
</svg>
